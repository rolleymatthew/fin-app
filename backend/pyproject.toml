[project]
name = "fin"
version = "0.1.0"
description = "Finance data service migrated from Spring Boot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "motor>=3.4",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
  "pypinyin>=0.50",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I"]
